<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroNav 3D Replay</title>
<style>
  :root { --bg: #eef0f2; --panel: #ffffff; --text: #1d2125; --muted: #5d656d; --line: #d5d9dd; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 0 2px; }
  header p { font-size: 12.5px; color: var(--muted); margin: 0; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 44px); }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 16px; overflow-y: auto; font-size: 13px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  select, input[type=range] { width: 100%; }
  select { padding: 5px; font-size: 13px; }
  .buttons { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 6px; font-size: 13px; border: 1px solid #b9c0c7; background: #f7f8f9; border-radius: 4px; cursor: pointer; }
  button:hover { background: #eceff1; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  td { padding: 3px 0; border-bottom: 1px solid #eef0f2; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .sw { width: 14px; height: 14px; border-radius: 2px; flex: none; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; line-height: 1.4; }
  #view { position: relative; }
  #event { position: absolute; left: 16px; top: 12px; background: rgba(255,255,255,0.92); border: 1px solid var(--line);
           padding: 6px 10px; font-size: 13px; border-radius: 4px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<header>
  <h1>AeroNav 3D replay</h1>
</header>
<div class="wrap">
  <aside>
    <label for="flight">Flight</label>
    <select id="flight"></select>
    <label for="speed">Speed: <span id="speedText">3</span> moves/s</label>
    <input id="speed" type="range" min="1" max="20" value="3">
    <div class="buttons"><button id="play">Pause</button><button id="restart">Restart</button></div>
    <table>
      <tr><td>Move</td><td id="move">0</td></tr>
      <tr><td>Square (row, col)</td><td id="square">-</td></tr>
      <tr><td>Gusts so far</td><td id="gusts">0</td></tr>
      <tr><td>Ending</td><td id="ending">-</td></tr>
    </table>
    <label>Legend</label>
    <div class="legend">
      <div><span class="sw" style="background:#7b848c"></span>Wall</div>
      <div><span class="sw" style="background:#3c9a5f"></span>Start</div>
      <div><span class="sw" style="background:#d9a521"></span>Goal</div>
      <div><span class="sw" style="background:#2f6fbf"></span>Route flown</div>
      <div><span class="sw" style="background:#cf3b3b"></span>Crash</div>
    </div>
    <p class="note">Drag to rotate, scroll to zoom.</p>
  </aside>
  <div id="view"><div id="event">Ready</div></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const FLIGHTS = /*FLIGHTS*/[];
const HEIGHT = 0.9;           // display height of the drone
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe4e8);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9096, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 14, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

let world = new THREE.Group();
scene.add(world);

// ---- drone built from simple shapes ----
function makeDrone() {
  const d = new THREE.Group();
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b3137, roughness: 0.5 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.08, 0.26), dark);
  body.castShadow = true;
  d.add(body);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.06), new THREE.MeshStandardMaterial({ color: 0x2f6fbf }));
  nose.position.set(0, 0.02, -0.15);
  d.add(nose);
  d.rotors = [];
  for (const [x, z] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.3), dark);
    arm.position.set(x * 0.11, 0, z * 0.11);
    arm.rotation.y = Math.atan2(x, z);
    d.add(arm);
    const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.01, 20),
      new THREE.MeshStandardMaterial({ color: 0x9aa3ab, transparent: true, opacity: 0.6 }));
    rotor.position.set(x * 0.2, 0.05, z * 0.2);
    d.add(rotor);
    d.rotors.push(rotor);
  }
  return d;
}
const drone = makeDrone();
scene.add(drone);

// ---- state ----
let flight, n, t, playing = true, crashed = false, trail, trailPoints;
const toXZ = ([r, c]) => new THREE.Vector3(c - (n - 1) / 2, HEIGHT, r - (n - 1) / 2);

function buildWorld(f) {
  scene.remove(world);
  world = new THREE.Group();
  scene.add(world);
  n = f.grid.length;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(n, n), new THREE.MeshStandardMaterial({ color: 0xf4f5f6 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  world.add(ground);
  const lines = new THREE.GridHelper(n, n, 0xc3c9ce, 0xc3c9ce);
  lines.position.y = 0.002;
  world.add(lines);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x7b848c, roughness: 0.8 });
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (f.grid[r][c] !== 1) continue;
    const h = 1.4;
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.96, h, 0.96), wallMat);
    const p = toXZ([r, c]);
    box.position.set(p.x, h / 2, p.z);
    box.castShadow = box.receiveShadow = true;
    world.add(box);
  }
  for (const [sq, color] of [[f.start, 0x3c9a5f], [f.goal, 0xd9a521]]) {
    const pad = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.9), new THREE.MeshStandardMaterial({ color }));
    const p = toXZ(sq);
    pad.position.set(p.x, 0.02, p.z);
    world.add(pad);
  }
  trailPoints = [];
  trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x2f6fbf }));
  world.add(trail);
  camera.position.set(0, n * 1.05, n * 1.05);
  controls.target.set(0, 0, 0);
}

function load(i) {
  flight = FLIGHTS[i];
  buildWorld(flight);
  t = 0; crashed = false;
  drone.position.copy(toXZ(flight.start));
  drone.rotation.set(0, 0, 0);
  addTrail(flight.start);
  document.getElementById("ending").textContent = "-";
  setEvent("Start");
}

function addTrail(sq) {
  const p = toXZ(sq);
  trailPoints.push(new THREE.Vector3(p.x, HEIGHT - 0.1, p.z));
  trail.geometry.dispose();
  trail.geometry = new THREE.BufferGeometry().setFromPoints(trailPoints);
}

function setEvent(text) { document.getElementById("event").textContent = text; }

function describe(e) {
  return { "move": "Moving", "gust": "Gust: the move was replaced", "collision": "Crash into a wall or the edge",
           "gust crash": "Gust pushed the drone into a wall or the edge", "goal": "Reached the goal",
           "timeout": "Ran out of moves (200)", "start": "Start" }[e] || e;
}

// ---- animation ----
const clock = new THREE.Clock();
function update(dt) {
  const steps = flight.steps;
  for (const r of drone.rotors) r.rotation.y += dt * 40;
  if (!playing || crashed) {
    if (crashed && drone.position.y > 0.08) { drone.position.y -= dt * 2.5; drone.rotation.z += dt * 3; }
    return;
  }
  const speed = Number(document.getElementById("speed").value);
  const last = steps.length - 1;
  if (t >= last) return;
  t = Math.min(last, t + dt * speed);
  const i = Math.floor(t), frac = t - i;
  const k = Math.min(i + 1, last);
  const step = steps[k];
  const a = toXZ(steps[i].pos);
  const isCrash = step.event === "collision" || step.event === "gust crash";
  const b = isCrash ? toXZ(steps[i].pos).lerp(toXZ(step.tried), 0.45) : toXZ(step.pos);
  drone.position.lerpVectors(a, b, frac);
  if (!a.equals(b)) {
    drone.rotation.y = Math.atan2(-(b.x - a.x), -(b.z - a.z));
    drone.rotation.x = -0.18;
  }
  const shown = frac > 0.5 ? k : i;
  document.getElementById("move").textContent = shown;
  document.getElementById("square").textContent = `(${steps[shown].pos[0]}, ${steps[shown].pos[1]})`;
  document.getElementById("gusts").textContent = steps.slice(1, shown + 1).filter(s => s.event.startsWith("gust")).length;
  if (frac > 0.5 && trailPoints.length <= k && !isCrash) addTrail(step.pos);
  setEvent(`Move ${shown}: ${describe(steps[shown].event)}`);
  if (t >= last) {
    drone.rotation.x = 0;
    document.getElementById("ending").textContent = flight.ending;
    if (isCrash) {
      crashed = true;
      drone.traverse(o => { if (o.material && o !== drone.rotors[0]) o.material = o.material.clone(); });
      drone.children[0].material.color.set(0xcf3b3b);
    }
  }
}

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

function loop() {
  update(Math.min(clock.getDelta(), 0.05));
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ---- controls ----
const select = document.getElementById("flight");
FLIGHTS.forEach((f, i) => select.add(new Option(f.label, i)));
select.onchange = () => { load(select.value); playing = true; document.getElementById("play").textContent = "Pause"; };
document.getElementById("restart").onclick = () => select.onchange();
document.getElementById("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; };
document.getElementById("speed").oninput = e => document.getElementById("speedText").textContent = e.target.value;

load(0);
resize();
loop();
</script>
</body>
</html>
